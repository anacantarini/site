baseURL = "https://anacantarini.github.io/site/" # Substitua 'site' pelo nome exato do seu repo antigo se for diferente
languageCode = "pt-br"
title = "Ana Cantarini | Terapeuta"

# Aponta para o tema hugo-profile dentro da pasta themes
theme = "hugo-profile"

[params]
  title = "Ana Cantarini"
  description = "Apoio terapêutico para te ajudar a fazer novas escolhas e parar de repetir os mesmos ciclos."
  favicon = "images/avatar.jpg"

  # Cor do tema (Tom terroso)
  color = { main = "#8B5A2B" }

  # Cabeçalho / Apresentação Principal (Hero Section)
  [params.hero]
    enable = true
    intro = "Olá, eu sou a"
    title = "Ana Cantarini"
    subtitle = "Atendimento Terapêutico & Escuta Terapêutica"
    content = "Apoio terapêutico para te ajudar a fazer novas escolhas e abrir espaço interno, com autonomia e no seu próprio tempo."
    image = "images/avatar.jpg"
    roundImage = true

  # Seção Sobre
  [params.about]
    enable = true
    title = "Sobre o Atendimento"
    content = "Você não precisa seguir sozinha. Ter companhia para aprofundar te ajuda a dar saltos de consciência e parar de repetir os mesmos ciclos."

# --- MENU DE NAVEGAÇÃO ---
[[menu.main]]
  name = "Início"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Sessões"
  url = "/sessoes/"
  weight = 2

[[menu.main]]
  name = "Podcast"
  url = "/podcast/"
  weight = 3

[[menu.main]]
  name = "Contato"
  url = "/contato/"
  weight = 4

# --- REDES SOCIAIS ---
[[params.social]]
  instagram = "https://instagram.com/anacantarini"
