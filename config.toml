baseURL = "https://anacantarini.github.io/site/"
languageCode = "pt-br"
title = "Ana Cantarini | Terapeuta"

theme = ["github.com/gurusabarish/hugo-profile"]

[module]
  [[module.imports]]
    path = "github.com/gurusabarish/hugo-profile"

[params]
  title = "Ana Cantarini"
  description = "Apoio terapêutico para te ajudar a fazer novas escolhas e parar de repetir os mesmos ciclos."
  favicon = "images/avatar.jpg"

  # Configurações do Tema / Cores
  color = { main = "#8B5A2B" } # Tom terroso principal
  
  # Foto e Apresentação Principal (Hero Section)
  [params.hero]
    enable = true
    intro = "Olá, eu sou a"
    title = "Ana Cantarini"
    subtitle = "Atendimento Terapêutico & Escuta Terapêutica"
    content = "Apoio terapêutico para te ajudar a fazer novas escolhas e abrir espaço interno, com autonomia e no seu próprio tempo."
    image = "images/avatar.jpg"
    roundImage = true

  # Seção "Sobre" na Página Inicial
  [params.about]
    enable = true
    title = "Sobre o Atendimento"
    content = "Você não precisa seguir sozinha. Ter companhia para aprofundar te ajuda a dar saltos de consciência e parar de repetir os mesmos ciclos."

# --- MENU DE NAVEGAÇÃO ---
[[menu.main]]
  name = "Início"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Sessões"
  url = "/sessoes/"
  weight = 2

[[menu.main]]
  name = "Podcast"
  url = "/podcast/"
  weight = 3

[[menu.main]]
  name = "Contato"
  url = "/contato/"
  weight = 4

# --- REDES SOCIAIS ---
[[params.social]]
  instagram = "https://instagram.com/anacantarini"
