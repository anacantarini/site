baseURL = "https://anacantarini.github.io/site/"
locale = "pt-br"
title = "Ana Cantarini | Terapeuta"

theme = ["github.com/zerostaticthemes/hugo-winston-theme"]

[module]
  [[module.imports]]
    path = "github.com/zerostaticthemes/hugo-winston-theme"

# --- PERSONALIZAÇÃO DE CORES E IDENTIDADE ---
[params]
  description = "Apoio terapêutico para te ajudar a fazer novas escolhas e parar de repetir os mesmos ciclos."
  
  # Paleta Suave e Minimalista (Tons Terrosos / Off-White Acolhedor)
  color_primary = "#8B5A2B"      # Tom terroso acolhedor para links e destaques
  color_background = "#FDFBF7"   # Fundo creme/off-white suave
  color_text = "#2C2C2C"         # Texto grafite escuro (leitura confortável)

  # Foto e Nome
  author_image = "images/avatar.jpg"
  author_name = "Ana Cantarini"

# --- MENU DE NAVEGAÇÃO ---
[[menu.main]]
  name = "Início"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Recursos"
  url = "/recursos/"
  weight = 2

[[menu.main]]
  name = "Sessões"
  url = "/sessoes/"
  weight = 3

[[menu.main]]
  name = "Podcast"
  url = "/podcast/"
  weight = 4

[[menu.main]]
  name = "Contato"
  url = "/contato/"
  weight = 5

